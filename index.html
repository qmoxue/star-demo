<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>和王若萱小朋友恋爱一百天</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff9ecd'/%3E%3Cpath d='M32 10l6.2 13.4 14.6 1.8-10.7 10 2.8 14.4L32 42.6 19.1 49.6l2.8-14.4-10.7-10 14.6-1.8z' fill='%23d6277e'/%3E%3C/svg%3E"
    />
    <link
      href="https://miaoda.feishu.cn/fonts/css2?family=Lato:wght@300;400;700&family=Noto+Serif+SC:wght@500;700&display=swap"
      rel="stylesheet"
      type="text/css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        /* 甜美粉色渐变背景：底部鲜亮、顶部柔和 */
        background: radial-gradient(ellipse at bottom, #ff9ecd 0%, #ffc2e2 45%, #ffe6f2 100%);
        font-family: 'Lato', 'Noto Serif SC', 'Microsoft YaHei', sans-serif;
      }

      /* ===== 五角星星空层 ===== */
      .star-layer {
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 200vh;
        pointer-events: none;
      }

      .star {
        position: absolute;
        /* 五角星形状 */
        clip-path: polygon(
          50% 0%,
          61% 35%,
          98% 35%,
          68% 57%,
          79% 91%,
          50% 70%,
          21% 91%,
          32% 57%,
          2% 35%,
          39% 35%
        );
        animation: twinkle ease-in-out infinite;
      }

      /* 视差上浮：每层速度不同 */
      .layer1 {
        animation: moveUp 200s linear infinite;
      }
      .layer2 {
        animation: moveUp 100s linear infinite;
      }
      .layer3 {
        animation: moveUp 50s linear infinite;
      }

      @keyframes moveUp {
        from {
          transform: translateY(0);
        }
        to {
          transform: translateY(-100vh);
        }
      }

      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.35;
          transform: scale(0.75) rotate(0deg);
        }
        50% {
          opacity: 1;
          transform: scale(1.1) rotate(18deg);
        }
      }

      /* ===== 居中标题：深粉闪闪发光 ===== */
      .title {
        position: absolute;
        top: 50%;
        left: 0;
        right: 0;
        margin-top: -45px;
        text-align: center;
        font-family: 'Lato', 'Noto Serif SC', 'Microsoft YaHei', sans-serif;
        font-weight: 700;
        font-size: 56px;
        letter-spacing: 12px;
        padding-left: 12px;
        /* 深粉渐变文字 */
        background: linear-gradient(180deg, #ff5fb0 0%, #d6277e 55%, #9c1458 100%);
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        /* 闪闪发光的深粉光晕 */
        filter: drop-shadow(0 0 6px rgba(255, 120, 190, 0.95))
          drop-shadow(0 0 18px rgba(214, 39, 126, 0.65))
          drop-shadow(0 0 36px rgba(255, 180, 215, 0.55));
        animation: titleSparkle 2.4s ease-in-out infinite;
      }

      @keyframes titleSparkle {
        0%,
        100% {
          filter: drop-shadow(0 0 5px rgba(255, 120, 190, 0.8))
            drop-shadow(0 0 14px rgba(214, 39, 126, 0.5))
            drop-shadow(0 0 28px rgba(255, 180, 215, 0.4));
        }
        50% {
          filter: drop-shadow(0 0 10px rgba(255, 170, 215, 1))
            drop-shadow(0 0 30px rgba(255, 90, 175, 0.85))
            drop-shadow(0 0 55px rgba(255, 210, 232, 0.75));
        }
      }

      /* 标题周围点缀的小闪光 */
      .sparkle-dot {
        position: absolute;
        width: 8px;
        height: 8px;
        background: radial-gradient(circle, #fff 0%, #ffb3d9 55%, transparent 70%);
        border-radius: 50%;
        animation: dotFlash 1.8s ease-in-out infinite;
        pointer-events: none;
      }

      @keyframes dotFlash {
        0%,
        100% {
          opacity: 0;
          transform: scale(0.3);
        }
        50% {
          opacity: 1;
          transform: scale(1.3);
        }
      }

      @media (max-width: 600px) {
        .title {
          font-size: 34px;
          letter-spacing: 6px;
          padding-left: 6px;
          margin-top: -28px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .star-layer,
        .star,
        .title,
        .sparkle-dot {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="star-layer layer1" id="layer1"></div>
    <div class="star-layer layer2" id="layer2"></div>
    <div class="star-layer layer3" id="layer3"></div>

    <div class="title">恋爱一百天纪念日快乐</div>

    <script>
      // 五角星配色：奶白、浅粉、亮粉交替，营造甜美层次感
      var STAR_COLORS = ['#fff7fb', '#ffe0ef', '#ff9ecc', '#ff6fb5'];

      // 三层视差配置：尺寸越大、数量越少、移动越快
      var LAYERS = [
        { id: 'layer1', count: 230, sizeMin: 5, sizeMax: 8, duration: [2.5, 5] },
        { id: 'layer2', count: 120, sizeMin: 9, sizeMax: 13, duration: [1.8, 4] },
        { id: 'layer3', count: 60, sizeMin: 14, sizeMax: 20, duration: [1.4, 3.2] }
      ];

      function rand(min, max) {
        return Math.random() * (max - min) + min;
      }

      LAYERS.forEach(function (cfg) {
        var layer = document.getElementById(cfg.id);
        for (var i = 0; i < cfg.count; i++) {
          var star = document.createElement('div');
          star.className = 'star';
          var size = rand(cfg.sizeMin, cfg.sizeMax);
          star.style.width = size + 'px';
          star.style.height = size + 'px';
          // 分布在两倍视口高度内，配合 -100vh 位移动画无缝循环
          star.style.left = rand(0, 96) + 'vw';
          star.style.top = rand(0, 200) + 'vh';
          star.style.background = STAR_COLORS[Math.floor(Math.random() * STAR_COLORS.length)];
          star.style.animationDuration = rand(cfg.duration[0], cfg.duration[1]).toFixed(2) + 's';
          star.style.animationDelay = rand(0, 4).toFixed(2) + 's';
          layer.appendChild(star);
        }
      });

      // 标题周围散落几颗小闪光点
      var title = document.querySelector('.title');
      var dotPositions = [
        { x: 12, y: -30 },
        { x: 82, y: -24 },
        { x: 22, y: 34 },
        { x: 72, y: 38 },
        { x: 50, y: -42 },
        { x: 4, y: 8 },
        { x: 92, y: 10 }
      ];
      dotPositions.forEach(function (pos, i) {
        var dot = document.createElement('div');
        dot.className = 'sparkle-dot';
        dot.style.left = pos.x + '%';
        dot.style.top = '50%';
        dot.style.transform = 'translateY(calc(-50% + ' + pos.y + 'px))';
        dot.style.animationDelay = i * 0.35 + 's';
        title.parentNode.appendChild(dot);
      });
    </script>
  </body>
</html>
